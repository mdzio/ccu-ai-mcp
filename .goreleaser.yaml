version: 2

project_name: ccu-ai-mcp

before:
  hooks:
    - go mod tidy
    - go build -o tmp/ tool/filltmpl.go
    - tmp/filltmpl -i "{{.Version}}" -o tmp/VERSION

builds:
  - id: generic
    binary: ccu-ai-mcp
    flags:
     - -trimpath
    ldflags:
     - -s -w -X main.appVersion={{.Version}}
    targets:
      - linux_amd64_v1
      - linux_arm_6
      - windows_amd64_v1
      - darwin_amd64_v1
      - darwin_arm64_v8.0
  - id: ccu-addon
    binary: addon/ccu-ai-mcp
    flags:
     - -trimpath
    ldflags:
     - -s -w -X main.appVersion={{.Version}}
    targets:
      - linux_amd64_v1
      - linux_arm_6

archives:
  - id: generic
    ids:
      - generic
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mode: 0755
    files:
      - LICENSE.txt
      - README.md
      - tools.toml
      - src: tmp/VERSION
        dst: VERSION
      - src: config.template.toml
        dst: config.toml
  - id: ccu-addon
    ids:
      - ccu-addon
    name_template: "{{ .ProjectName }}_ccu-addon_{{ .Version }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    builds_info:
      mode: 0755
    files:
      - src: LICENSE.txt
        dst: addon/LICENSE.txt
      - src: README.md
        dst: addon/README.md
      - src: tmp/VERSION
        dst: addon/VERSION
      - src: tools.toml
        dst: addon/tools.toml
      - src: ccu-addon/config.default.toml
        dst: config.default.toml
      - src: ccu-addon/addon/update_hm_addons.tcl
        dst: addon/update_hm_addons.tcl
        info:
          mode: 0755
      - src: ccu-addon/rc.d/ccu-ai-mcp
        dst: rc.d/ccu-ai-mcp
        info:
          mode: 0755
      - src: ccu-addon/update_script
        dst: update_script
        info:
          mode: 0755
      - src: ccu-addon/www/config.cgi
        dst: www/config.cgi
      - src: ccu-addon/www/update-check.cgi
        dst: www/update-check.cgi

release:
  skip_upload: false
  github:
    owner: mdzio
    name: ccu-ai-mcp
  draft: true
