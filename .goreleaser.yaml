version: 2

project_name: ccu-ai-mcp

before:
  hooks:
    - go mod tidy
    - go build -o tmp/ tool/filltmpl.go

builds:
  - id: linux
    binary: ccu-ai-mcp
    flags:
     - -trimpath
    ldflags:
     - -s -w -X main.appVersion={{.Version}}
    targets:
      - linux_amd64_v1
      - linux_arm_6
  - id: windows_darwin
    binary: ccu-ai-mcp
    flags:
     - -trimpath
    ldflags:
     - -s -w -X main.appVersion={{.Version}}
    targets:
      - windows_amd64_v1
      - darwin_amd64_v1
      - darwin_arm64_v8.0

archives:
  - id: generic
    ids:
      - linux
      - windows_darwin
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mode: 0755
    files:
      - LICENSE.txt
      - README.md
      - tools.toml
      - src: config.template.toml
        dst: config.toml
  - id: ccu-addon
    ids:
      - linux
    name_template: "{{ .ProjectName }}_ccu-addon_{{ .Version }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    builds_info:
      mode: 0755
    files:
      - LICENSE.txt
      - README.md
      - tools.toml
      - src: config.template.toml
        dst: config.toml

release:
  skip_upload: false
  github:
    owner: mdzio
    name: ccu-ai-mcp
  draft: true
