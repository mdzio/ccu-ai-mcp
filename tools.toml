[[tool]]
name = 'list_system_variables'
description = '''
Enumerates all system variables in the CCU. Returns following properties: ISEID, Name,
Description, Maximum, Unit, Minimum, Operations, Type, Value name 0 (only valid for types
BOOL, ALARM), Value name 1 (only valid for types BOOL, ALARM), Value list (only valid for
type ENUM) and programs referencing the variable.
'''
kind = 'hm-script'
enabled = true
script = '''
! Enumerating system variables
object sysVars = dom.GetObject(ID_SYSTEM_VARIABLES);
if (sysVars) {
	WriteLine("Result is a markdown table:");
	WriteLine("| ISEID | Name | Description | Maximum | Unit | Minimum | Type | Value name 0 | Value name 1 | Value list | Used by programs |");
	WriteLine("|---|---|---|---|---|---|---|---|---|---|---|");
	string id;
	integer count = 0;
	foreach (id, sysVars.EnumUsedIDs()) {
		object sv = dom.GetObject(id);
		integer vt = sv.ValueType();
		integer st = sv.ValueSubType();
		string outvt = "UNKNOWN";
		if (vt == ivtBinary) {
			if (st == istBool) {
				outvt = "BOOL";
			} elseif (st == istAlarm) {
				outvt = "ALARM(BOOL)";
			}
		} elseif (vt == ivtInteger) {
			if (st == istEnum) {
				outvt = "ENUM(INTEGER)";
			}
		} elseif (vt == ivtFloat) {
			outvt = "FLOAT";
		} elseif (vt == ivtString) {
			outvt = "STRING";
		}
		WriteLine("| " # id # " | " # sv.Name() # " | " # sv.DPInfo() # " | " # sv.ValueMax() # " | " #
			sv.ValueUnit() # " | " # sv.ValueMin() # " | " # outvt # " | " #
			sv.ValueName0() # " | " # sv.ValueName1() # " | " # sv.ValueList() # " | " #
			sv.DPEnumUsagePrograms().Replace("\t", ",") # " |");
		count = count + 1;
	}
	WriteLine("\nFound " # count # " system variables.");
} else {
	WriteLine("ERROR: Object with ISEID ID_SYSTEM_VARIABLES not found.");
}
'''

# -----------------------------------------------------------------------------
[[tool]]
name = 'update_system_variable'
description = 'Updates properties of a CCU system variable (e.g. name, description).'
kind = 'hm-script'
enabled = true
script = '''
integer variableID = {{ .variableID }};
object svObj = dom.GetObject(variableID);
if (svObj) {
    if ((!svObj.IsTypeOf(OT_VARDP)) && (!svObj.IsTypeOf(OT_ALARMDP))) { 
        WriteLine("ERROR: Object with ISEID " # variableID # " is not a system or alarm variable."); 
        quit; 
    }
{{if .newName }} 
    string newName = {{ printf "%q" .newName }};
    svObj.Name(newName);
    WriteLine("Update of system variable name succeeded.");
{{end}}
{{if .newDescription}}
    string newDescription = {{ printf "%q" .newDescription }};
    svObj.DPInfo(newDescription);
    WriteLine("Update of system variable description succeeded.");
{{end}}
    dom.RTUpdate(false);
} else {
  WriteLine("ERROR: Object with ISEID " # variableID # " not found.");
}
'''

[[tool.parameter]]
name = "variableID"
description = "ISEID of the system variable"
type = "integer"

[[tool.parameter]]
name = "newName"
description = "New name for the system variable"
type = "string"
optional = true

[[tool.parameter]]
name = "newDescription"
description = "New description for the system variable"
type = "string"
optional = true

